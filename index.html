<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoQuiz</title>
  <style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef3f7;color:#17212b}
.container{max-width:850px;margin:40px auto;padding:20px}
.card{background:#fff;border-radius:18px;padding:30px;box-shadow:0 8px 25px rgba(0,0,0,.10)}
h1{margin-top:0;font-size:36px}.sub{color:#5b6873}
button{border:0;border-radius:10px;padding:13px 18px;font-size:16px;cursor:pointer;background:#173f5f;color:#fff}
button:hover{opacity:.9}.hidden{display:none}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:25px 0}
.topic{padding:18px;border:2px solid #d8e0e6;border-radius:12px;background:#fafcfd;color:#17212b;cursor:pointer;text-align:left}
.topic.selected{border-color:#173f5f;background:#edf5fa}
.progress{height:10px;background:#dce3e8;border-radius:10px;overflow:hidden;margin:20px 0}
.bar{height:100%;width:0;background:#173f5f;transition:.3s}
.option{display:block;width:100%;margin:10px 0;background:#f5f7f9;color:#17212b;text-align:left;border:2px solid #dce3e8}
.option.correct{background:#dff3e4;border-color:#5a9b67}
.option.wrong{background:#f8dddd;border-color:#c75c5c}
.option:disabled{cursor:default;opacity:1}
.feedback{padding:15px;border-radius:10px;margin:15px 0;background:#f2f5f7}
.score{font-size:48px;font-weight:bold;text-align:center;margin:20px}
.center{text-align:center}.small{font-size:14px;color:#65727d}

</style>
</head>
<body>
  <main class="container">
    <section class="card" id="home">
      <h1>🌎 GeoQuiz</h1>
      <p class="sub">Aprende y pon a prueba tus conocimientos sobre geopolítica.</p>
      <h3>Selecciona un tema</h3>

      <div class="topic-grid">
        <button class="topic" data-topic="Conflictos internacionales">⚔️ Conflictos internacionales</button>
        <button class="topic" data-topic="Comercio internacional">🚢 Comercio internacional</button>
        <button class="topic" data-topic="Relaciones entre países">🤝 Relaciones entre países</button>
        <button class="topic" data-topic="Bloques económicos">🌐 Bloques económicos</button>
        <button class="topic" data-topic="Economía y geopolítica">💰 Economía y geopolítica</button>
      </div>

      <p id="selectedText" class="small">Selecciona un tema para comenzar.</p>
      <button id="start">Comenzar quiz</button>
    </section>

    <section class="card hidden" id="quiz">
      <div class="small" id="counter"></div>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <h2 id="question"></h2>
      <div id="options"></div>
      <div id="feedback" class="feedback hidden"></div>
      <button id="next" class="hidden">Siguiente pregunta</button>
    </section>

    <section class="card hidden" id="result">
      <div class="center">
        <h1>🎉 Quiz terminado</h1>
        <div class="score" id="score"></div>
        <h2 id="level"></h2>
        <p id="summary"></p>
        <button id="restart">Volver a empezar</button>
      </div>
    </section>
  </main>

  <script>
// =========================
// BANCO DE PREGUNTAS
// =========================
// Cada tema tiene sus propias preguntas.
// Por eso al escoger un tema, GeoQuiz filtra únicamente
// las preguntas pertenecientes a esa categoría.

const questions = [
  // CONFLICTOS INTERNACIONALES
  {t:"Conflictos internacionales",q:"¿Por qué un conflicto entre dos países puede afectar a otros países?",
   o:["Porque ningún país depende de otros","Porque puede alterar el comercio y las cadenas de suministro","Porque los conflictos solo tienen efectos militares","Porque no tiene consecuencias fuera de la zona"],
   a:1,e:"Los conflictos pueden interrumpir rutas, proveedores y relaciones comerciales, generando efectos fuera de los países directamente involucrados."},
  {t:"Conflictos internacionales",q:"¿Qué concepto permite analizar la exposición de un país ante una tensión internacional?",
   o:["Riesgo geopolítico","Publicidad","Clima","Turismo"],
   a:0,e:"El riesgo geopolítico ayuda a estudiar la exposición ante conflictos, tensiones, sanciones y otros acontecimientos políticos internacionales."},
  {t:"Conflictos internacionales",q:"Una guerra puede afectar las cadenas de suministro principalmente porque...",
   o:["Siempre aumenta la producción mundial","Puede interrumpir rutas, proveedores y transporte","Elimina todas las fronteras","Hace que todos los productos bajen de precio"],
   a:1,e:"Los conflictos pueden dificultar el transporte y el acceso a proveedores, afectando la llegada de bienes."},

  // COMERCIO INTERNACIONAL
  {t:"Comercio internacional",q:"Si un país deja de exportar un producto que otro país necesita, ¿qué podría ocurrir?",
   o:["Podrían buscarse nuevos proveedores y aumentar los costos","El producto necesariamente se vuelve gratis","No ocurre ningún cambio","Se detiene todo el comercio mundial"],
   a:0,e:"El país afectado puede buscar nuevos proveedores y enfrentar cambios en precios y costos."},
  {t:"Comercio internacional",q:"¿Qué puede provocar una barrera comercial entre dos países?",
   o:["Mayor facilidad para importar","Mayor dificultad o costo para comerciar","La desaparición de las fronteras","Que todos los productos bajen de precio"],
   a:1,e:"Las barreras comerciales pueden dificultar el intercambio y aumentar costos o reducir determinados flujos comerciales."},
  {t:"Comercio internacional",q:"¿Por qué la dependencia de un solo proveedor extranjero puede ser un riesgo para una empresa?",
   o:["Porque garantiza que nunca habrá problemas","Porque una crisis puede interrumpir el suministro","Porque elimina los costos de transporte","Porque impide vender dentro del país"],
   a:1,e:"Una interrupción política, económica o logística puede afectar el suministro cuando existe una alta dependencia de un solo proveedor."},

  // RELACIONES ENTRE PAÍSES
  {t:"Relaciones entre países",q:"¿Qué puede buscar un país al establecer una alianza con otros Estados?",
   o:["Aislarse completamente","Fortalecer la cooperación y defender intereses comunes","Eliminar todo comercio","Evitar cualquier relación internacional"],
   a:1,e:"Las alianzas permiten coordinar intereses y cooperación política, económica, comercial o de seguridad."},
  {t:"Relaciones entre países",q:"¿Cuál es una razón para mantener relaciones diplomáticas con otros países?",
   o:["Facilitar diálogo y cooperación","Evitar todo contacto internacional","Eliminar los acuerdos comerciales","Impedir la negociación"],
   a:0,e:"La diplomacia facilita el diálogo, la negociación y la cooperación entre Estados."},
  {t:"Relaciones entre países",q:"¿Qué puede suceder cuando un país depende demasiado de un solo socio comercial?",
   o:["Aumenta su exposición ante cambios en esa relación","Desaparece cualquier riesgo","Se vuelve imposible una crisis","El comercio deja de existir"],
   a:0,e:"Una alta dependencia puede aumentar la vulnerabilidad si cambian las condiciones políticas, económicas o comerciales del socio."},

  // BLOQUES ECONÓMICOS
  {t:"Bloques económicos",q:"¿Qué caracteriza principalmente a un bloque económico?",
   o:["La cooperación económica entre varios países","Que solo exista un país miembro","La eliminación de todos los gobiernos","Que ningún miembro pueda comerciar"],
   a:0,e:"Los bloques económicos reúnen países que buscan facilitar o coordinar relaciones económicas y comerciales."},
  {t:"Bloques económicos",q:"¿Por qué es útil comparar la respuesta de distintos bloques ante un mismo acontecimiento?",
   o:["Para observar diferencias en intereses y estrategias","Para demostrar que todos reaccionan igual","Para eliminar la geografía","Para evitar analizar relaciones internacionales"],
   a:0,e:"Comparar actores permite identificar intereses, capacidades y estrategias diferentes frente a una misma situación."},
  {t:"Bloques económicos",q:"La integración económica entre países puede facilitar principalmente...",
   o:["La cooperación y el intercambio comercial","El aislamiento de todos los miembros","La desaparición de los mercados","La prohibición de exportaciones"],
   a:0,e:"La integración puede facilitar la cooperación y determinadas formas de intercambio entre los países miembros."},

  // ECONOMÍA Y GEOPOLÍTICA
  {t:"Economía y geopolítica",q:"Una crisis geopolítica puede influir en la economía porque...",
   o:["La política y la economía nunca se relacionan","Puede afectar precios, comercio, inversión y suministro","Solo afecta los mapas","Siempre reduce los precios"],
   a:1,e:"Las decisiones y conflictos internacionales pueden producir cambios en precios, comercio, inversión y disponibilidad de bienes."},
  {t:"Economía y geopolítica",q:"¿Qué actor puede necesitar información geopolítica antes de tomar una decisión comercial?",
   o:["Un importador","Un inversionista","Una empresa","Todos los anteriores"],
   a:3,e:"Empresas, importadores e inversionistas pueden verse afectados por cambios políticos, comerciales y económicos internacionales."},
  {t:"Economía y geopolítica",q:"Si una crisis internacional aumenta el costo de transporte, una empresa importadora podría...",
   o:["Analizar proveedores y rutas alternativas","Ignorar completamente el problema","Suponer que los costos bajarán siempre","Dejar de analizar el mercado"],
   a:0,e:"Una empresa puede evaluar proveedores, rutas y costos alternativos para reducir su exposición al cambio."}
];

let selectedTopic = null;
let current = 0;
let score = 0;
let filtered = [];

const home = document.getElementById("home");
const quiz = document.getElementById("quiz");
const result = document.getElementById("result");
const selectedText = document.getElementById("selectedText");

document.querySelectorAll(".topic").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".topic").forEach(b => b.classList.remove("selected"));
    button.classList.add("selected");
    selectedTopic = button.dataset.topic;
    selectedText.textContent = "Tema seleccionado: " + selectedTopic;
  });
});

document.getElementById("start").addEventListener("click", () => {
  // FILTER es la parte que hace que cada tema tenga preguntas diferentes.
  filtered = selectedTopic
    ? questions.filter(question => question.t === selectedTopic)
    : questions;

  current = 0;
  score = 0;
  home.classList.add("hidden");
  result.classList.add("hidden");
  quiz.classList.remove("hidden");
  showQuestion();
});

function showQuestion() {
  const question = filtered[current];

  document.getElementById("counter").textContent =
    `Pregunta ${current + 1} de ${filtered.length}`;

  document.getElementById("bar").style.width =
    ((current) / filtered.length * 100) + "%";

  document.getElementById("question").textContent = question.q;

  const optionsBox = document.getElementById("options");
  optionsBox.innerHTML = "";

  document.getElementById("feedback").classList.add("hidden");
  document.getElementById("next").classList.add("hidden");

  question.o.forEach((option, index) => {
    const button = document.createElement("button");
    button.className = "option";
    button.textContent = option;
    button.addEventListener("click", () => answer(index, button));
    optionsBox.appendChild(button);
  });
}

function answer(selectedIndex, selectedButton) {
  const question = filtered[current];

  document.querySelectorAll(".option").forEach((button, index) => {
    button.disabled = true;
    if (index === question.a) button.classList.add("correct");
  });

  const feedback = document.getElementById("feedback");

  if (selectedIndex === question.a) {
    score++;
    feedback.textContent = "✅ ¡Correcto! " + question.e;
  } else {
    selectedButton.classList.add("wrong");
    feedback.textContent = "❌ Incorrecto. " + question.e;
  }

  feedback.classList.remove("hidden");
  document.getElementById("next").classList.remove("hidden");
}

document.getElementById("next").addEventListener("click", () => {
  current++;

  if (current < filtered.length) {
    showQuestion();
  } else {
    finish();
  }
});

function finish() {
  quiz.classList.add("hidden");
  result.classList.remove("hidden");

  const percentage = Math.round(score / filtered.length * 100);

  document.getElementById("score").textContent =
    `${score}/${filtered.length} (${percentage}%)`;

  document.getElementById("level").textContent =
    percentage >= 80 ? "Nivel avanzado 🌟" :
    percentage >= 60 ? "Nivel intermedio 👍" :
    "Nivel inicial 📚";

  document.getElementById("summary").textContent =
    "GeoQuiz permite aprender conceptos geopolíticos mediante preguntas y explicaciones sencillas.";
}

document.getElementById("restart").addEventListener("click", () => {
  result.classList.add("hidden");
  home.classList.remove("hidden");
  selectedTopic = null;
  selectedText.textContent = "Selecciona un tema para comenzar.";
  document.querySelectorAll(".topic").forEach(b => b.classList.remove("selected"));
});

</script>
</body>
</html>
